[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "teller-story"
version = "0.1.0"
description = "Turn stories into multi-voice audio with cloud or local models"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Teller contributors" }]
dependencies = [
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "sounddevice>=0.5,<1",
  "soundfile>=0.13,<1",
  "tomli>=2.2,<3; python_version < '3.11'",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
cloud = [
  "google-genai>=2.25,<3",
  "keyring>=25,<27",
]
local = [
  "kokoro-onnx>=0.6.1,<1",
  "ollama>=0.6,<1",
]
all = [
  "google-genai>=2.25,<3",
  "keyring>=25,<27",
  "kokoro-onnx>=0.6.1,<1",
  "ollama>=0.6,<1",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
teller = "teller.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/teller"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["teller"]
warn_unused_ignores = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
