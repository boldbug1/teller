<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Warm Rose / Mulberry Cameo Badge -->
    <radialGradient id="female-rim" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="45%" stop-color="#e11d48" />
      <stop offset="85%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#881337" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Beveled Silver Ring -->
  <circle cx="60" cy="60" r="57" fill="url(#silver-metal)" filter="url(#soft-shadow)" />
  <circle cx="60" cy="60" r="53" fill="#ffffff" opacity="0.35" />

  <!-- Inner Rose Enamel Medallion -->
  <circle cx="60" cy="60" r="51" fill="url(#female-rim)" />

  <!-- Solid Graceful Lady Cameo Silhouette (NO eyes, NO mouth) -->
  <g filter="url(#soft-shadow)" fill="#ffffff">
    <!-- Hair Bun -->
    <circle cx="60" cy="22" r="12" />
    <!-- Solid Head Silhouette -->
    <path d="M44 44 C 40 28, 48 22, 60 22 C 72 22, 80 28, 76 44 C 76 56, 70 64, 60 64 C 50 64, 44 56, 44 44 Z" />
    <!-- Solid Neck & Gown Shoulders -->
    <path d="M53 64 L 67 64 L 66 74 L 54 74 Z" />
    <path d="M22 100 C 28 80, 42 74, 60 74 C 78 74, 92 80, 98 100 Z" />
  </g>

  <!-- Specular Lens Curve -->
  <path d="M14 52 C 18 30, 36 15, 60 15 C 84 15, 102 30, 106 52 C 88 38, 68 35, 60 35 C 52 35, 32 38, 14 52 Z" fill="#ffffff" opacity="0.25" />
</svg>
