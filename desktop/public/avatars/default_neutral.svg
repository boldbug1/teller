<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Warm Sage / Forest Enamel Badge -->
    <radialGradient id="neutral-rim" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Beveled Silver Ring -->
  <circle cx="60" cy="60" r="57" fill="url(#silver-metal)" filter="url(#soft-shadow)" />
  <circle cx="60" cy="60" r="53" fill="#ffffff" opacity="0.35" />

  <!-- Inner Sage Enamel Medallion -->
  <circle cx="60" cy="60" r="51" fill="url(#neutral-rim)" />

  <!-- Clean Sound Crest / Lyre Silhouette (NO eyes, NO mouth) -->
  <g filter="url(#soft-shadow)" fill="#ffffff">
    <!-- Center Sound Pillar -->
    <rect x="58" y="32" width="4" height="42" rx="2" />
    <circle cx="60" cy="27" r="4" />
    <!-- Harmonious Acoustic Arcs -->
    <path d="M48 40 C 44 46, 44 60, 48 66 L 52 64 C 48 59, 48 47, 52 42 Z" opacity="0.95" />
    <path d="M38 34 C 32 44, 32 62, 38 72 L 42 70 C 36 61, 36 45, 42 36 Z" opacity="0.8" />
    <path d="M72 40 C 76 46, 76 60, 72 66 L 68 64 C 72 59, 72 47, 68 42 Z" opacity="0.95" />
    <path d="M82 34 C 88 44, 88 62, 82 72 L 78 70 C 84 61, 84 45, 78 36 Z" opacity="0.8" />
    <!-- Base Pedestal -->
    <path d="M40 76 L 80 76 L 76 82 L 44 82 Z" rx="2" />
    <rect x="46" y="83" width="28" height="4" rx="2" />
  </g>

  <!-- Specular Lens Curve -->
  <path d="M14 52 C 18 30, 36 15, 60 15 C 84 15, 102 30, 106 52 C 88 38, 68 35, 60 35 C 52 35, 32 38, 14 52 Z" fill="#ffffff" opacity="0.25" />
</svg>
