<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Warm Indigo / Slate Cameo Badge -->
    <radialGradient id="male-rim" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="45%" stop-color="#1d4ed8" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </radialGradient>
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Beveled Silver Ring -->
  <circle cx="60" cy="60" r="57" fill="url(#silver-metal)" filter="url(#soft-shadow)" />
  <circle cx="60" cy="60" r="53" fill="#ffffff" opacity="0.35" />

  <!-- Inner Navy Enamel Medallion -->
  <circle cx="60" cy="60" r="51" fill="url(#male-rim)" />

  <!-- Solid Crisp Cameo Profile Bust (NO eyes, NO mouth) -->
  <g filter="url(#soft-shadow)" fill="#ffffff">
    <!-- Clean Solid Head & Hair Silhouette -->
    <path d="M42 42 C 40 25, 52 18, 64 18 C 76 18, 85 25, 83 40 C 85 52, 78 64, 64 64 C 50 64, 43 52, 42 42 Z" />
    <!-- Solid Neck & Shoulders -->
    <path d="M52 64 L 68 64 L 67 74 L 53 74 Z" />
    <path d="M22 100 C 28 78, 44 72, 60 72 C 76 72, 92 78, 98 100 Z" />
  </g>

  <!-- Specular Lens Curve -->
  <path d="M14 52 C 18 30, 36 15, 60 15 C 84 15, 102 30, 106 52 C 88 38, 68 35, 60 35 C 52 35, 32 38, 14 52 Z" fill="#ffffff" opacity="0.25" />
</svg>
