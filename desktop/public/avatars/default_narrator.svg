<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Warm Cozy Amber / Honey Enamel Badge -->
    <radialGradient id="narrator-rim" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#fde68a" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="book-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#451a03" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Beveled Golden Ring -->
  <circle cx="60" cy="60" r="57" fill="url(#gold-metal)" filter="url(#soft-shadow)" />
  <circle cx="60" cy="60" r="53" fill="#ffffff" opacity="0.3" />

  <!-- Inner Honey Enamel Medallion -->
  <circle cx="60" cy="60" r="51" fill="url(#narrator-rim)" />

  <!-- Storyteller Motif: Open Book & Radiating Quill (NO eyes, NO mouth) -->
  <g filter="url(#soft-shadow)">
    <!-- Open Book Pages -->
    <path d="M25 66 C 36 60, 50 62, 60 66 C 70 62, 84 60, 95 66 L 95 86 C 84 80, 70 82, 60 86 C 50 82, 36 80, 25 86 Z" fill="url(#book-grad)" stroke="#d97706" stroke-width="1.5" />
    <path d="M60 66 L 60 86" stroke="#b45309" stroke-width="2" />
    
    <!-- Feather Quill -->
    <path d="M72 24 C 84 20, 88 34, 82 46 C 78 54, 68 64, 61 72 L 57 68 C 64 60, 72 50, 74 44 C 76 38, 70 34, 66 36 Q 69 30 72 24 Z" fill="#ffffff" />
    <!-- Feather spine -->
    <path d="M72 24 Q 68 46 58 70" stroke="#d97706" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Radiating Acoustic Waves -->
    <path d="M38 46 C 42 40, 50 36, 60 36 C 68 36, 74 38, 78 42" stroke="#fef3c7" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M44 52 C 48 48, 54 44, 60 44 C 66 44, 70 46, 74 48" stroke="#fef3c7" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Specular Lens Curve -->
  <path d="M14 52 C 18 30, 36 15, 60 15 C 84 15, 102 30, 106 52 C 88 38, 68 35, 60 35 C 52 35, 32 38, 14 52 Z" fill="#ffffff" opacity="0.25" />
</svg>
