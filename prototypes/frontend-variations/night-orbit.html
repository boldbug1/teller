<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Orbit</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #070911;
      --panel: #10131e;
      --line: rgba(229, 234, 255, .16);
      --white: #edf0ff;
      --violet: #a78bfa;
      --acid: #bdfd73;
      --cyan: #70e6df;
      --coral: #ff7c82;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 74% 20%, rgba(112, 230, 223, .08), transparent 24rem),
        radial-gradient(circle at 46% 56%, rgba(167, 139, 250, .09), transparent 35rem),
        var(--night);
      font-family: system-ui, sans-serif;
      transition: background .8s ease;
    }

    body.aurora {
      background:
        radial-gradient(ellipse at 62% -10%, rgba(189, 253, 115, .19), transparent 36rem),
        radial-gradient(ellipse at 88% 44%, rgba(112, 230, 223, .15), transparent 30rem),
        radial-gradient(circle at 34% 70%, rgba(167, 139, 250, .14), transparent 42rem),
        var(--night);
    }

    button {
      appearance: none;
      border: 0;
      padding: 0;
      color: inherit;
      background: none;
      cursor: pointer;
    }

    button:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--acid);
      outline-offset: 4px;
    }

    svg { display: block; }

    .stars,
    .stars::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .stars::before {
      content: "";
      opacity: .55;
      background-image:
        radial-gradient(circle, #fff 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(167,139,250,.8) 0 1px, transparent 1.5px);
      background-size: 83px 83px, 131px 131px;
      background-position: 17px 23px, 41px 67px;
      mask-image: linear-gradient(to right, transparent, black 18%, black 85%, transparent);
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--white);
      opacity: var(--o);
      animation: twinkle var(--d) ease-in-out infinite alternate;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: 78px 1fr;
      position: relative;
    }

    .rail {
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      padding: 20px 0;
      border-right: 1px solid var(--line);
      background: rgba(7, 9, 17, .68);
      backdrop-filter: blur(18px);
    }

    .brand {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      margin-bottom: 26px;
      border: 1px solid rgba(237, 240, 255, .32);
      border-radius: 50%;
      position: relative;
    }

    .brand::before,
    .brand::after {
      content: "";
      position: absolute;
      border: 1px solid var(--violet);
      border-radius: 50%;
    }

    .brand::before { width: 23px; height: 9px; transform: rotate(38deg); }
    .brand::after { width: 9px; height: 23px; transform: rotate(38deg); }

    .brand i { width: 5px; height: 5px; border-radius: 50%; background: var(--acid); box-shadow: 0 0 12px var(--acid); }

    .rail-button,
    .round-button {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 50%;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .rail-button:hover,
    .round-button:hover { border-color: var(--line); background: rgba(255,255,255,.05); transform: scale(1.05); }
    .rail-button.active { color: var(--acid); border-color: rgba(189,253,115,.35); background: rgba(189,253,115,.08); }
    .rail-button svg,
    .round-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .rail-spacer { flex: 1; }

    .surface {
      min-width: 0;
      display: grid;
      grid-template-rows: 72px 1fr;
    }

    .topbar {
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px 0 34px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(7,9,17,.62), rgba(16,19,30,.4));
      backdrop-filter: blur(14px);
    }

    .phase {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .phase i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid rgba(237,240,255,.5);
    }

    .phase i:nth-child(2) { width: 38px; border-radius: 8px; background: linear-gradient(90deg, var(--violet), var(--cyan)); border: 0; box-shadow: 0 0 20px rgba(112,230,223,.25); }

    .top-actions { display: flex; align-items: center; gap: 7px; }

    .content {
      min-height: 0;
      display: grid;
      grid-template-columns: 220px minmax(500px, 1fr) 220px;
      position: relative;
    }

    .queue,
    .voices {
      z-index: 4;
      min-height: 0;
      padding: 28px 24px 126px;
      border-right: 1px solid var(--line);
      background: rgba(10, 12, 22, .34);
      backdrop-filter: blur(8px);
    }

    .voices { border-right: 0; border-left: 1px solid var(--line); }

    .queue-list { display: grid; gap: 14px; }

    .orbit-card {
      width: 100%;
      height: 92px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 46px 14px 14px 46px;
      background: rgba(255,255,255,.025);
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
    }

    .orbit-card:hover { transform: translateX(5px); border-color: rgba(167,139,250,.55); }
    .orbit-card.active { background: linear-gradient(100deg, rgba(167,139,250,.16), rgba(112,230,223,.04)); border-color: rgba(167,139,250,.55); }

    .mini-planet {
      position: absolute;
      width: 62px;
      height: 62px;
      left: 14px;
      top: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 31%, #dcd4ff, var(--violet) 25%, #423468 70%);
      box-shadow: inset -9px -8px 18px rgba(0,0,0,.42), 0 0 22px rgba(167,139,250,.18);
    }

    .orbit-card:nth-child(2) .mini-planet { background: radial-gradient(circle at 32% 28%, #ddffb5, #6f9b47 32%, #243219 72%); }
    .orbit-card:nth-child(3) .mini-planet { background: radial-gradient(circle at 33% 28%, #ffd3d5, var(--coral) 29%, #5b262f 72%); }
    .orbit-card:nth-child(4) .mini-planet { background: radial-gradient(circle at 33% 28%, #c7ffff, #3fa7a4 29%, #173637 72%); }

    .mini-planet::after {
      content: "";
      position: absolute;
      width: 78px;
      height: 22px;
      left: -9px;
      top: 19px;
      border: 1px solid rgba(237,240,255,.68);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    .card-signal {
      position: absolute;
      left: 91px;
      right: 13px;
      top: 29px;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .card-signal i { flex: 1; max-width: 4px; height: var(--h); border-radius: 5px; background: rgba(237,240,255,.38); }
    .orbit-card.active .card-signal i:nth-child(-n+7) { background: var(--acid); box-shadow: 0 0 6px rgba(189,253,115,.32); }

    .space {
      min-width: 0;
      min-height: 0;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      perspective: 1100px;
    }

    .constellation {
      position: absolute;
      inset: 7% 6%;
      width: 88%;
      height: 86%;
      opacity: .28;
      pointer-events: none;
    }

    .constellation path { stroke: url(#constellationGradient); stroke-width: .6; fill: none; stroke-dasharray: 3 7; animation: dash 18s linear infinite; }
    .constellation circle { fill: var(--white); filter: drop-shadow(0 0 4px var(--cyan)); }

    .orbit-system {
      width: min(57vw, 690px);
      aspect-ratio: 1;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .25s ease-out;
    }

    .ring {
      position: absolute;
      inset: var(--inset);
      border: 1px solid rgba(237, 240, 255, var(--alpha));
      border-radius: 50%;
      transform: rotateX(66deg) rotateZ(var(--turn));
    }

    .ring::before {
      content: "";
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--left);
      top: calc(var(--size) / -2);
      border-radius: 50%;
      background: var(--color);
      box-shadow: 0 0 14px var(--color);
      animation: satellite 9s ease-in-out infinite alternate;
    }

    .ring.one { --inset: 2%; --alpha: .12; --turn: -14deg; --size: 7px; --left: 23%; --color: var(--cyan); }
    .ring.two { --inset: 13%; --alpha: .18; --turn: 19deg; --size: 9px; --left: 72%; --color: var(--acid); }
    .ring.three { --inset: 25%; --alpha: .22; --turn: -31deg; --size: 6px; --left: 40%; --color: var(--coral); }

    .halo {
      position: absolute;
      inset: 27%;
      border-radius: 50%;
      border: 1px solid rgba(167,139,250,.25);
      box-shadow: 0 0 70px rgba(167,139,250,.16), inset 0 0 60px rgba(112,230,223,.06);
      animation: halo 5s ease-in-out infinite;
    }

    .core {
      position: absolute;
      inset: 32%;
      display: grid;
      place-items: center;
      border: 1px solid rgba(237,240,255,.34);
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 32%, rgba(237,240,255,.34), transparent 8%),
        radial-gradient(circle at 43% 38%, #7f6bc3, #242238 53%, #0c0e18 72%);
      box-shadow: inset -21px -18px 35px rgba(0,0,0,.48), 0 0 60px rgba(167,139,250,.22);
      z-index: 3;
    }

    .core::before {
      content: "";
      position: absolute;
      inset: -28%;
      border-radius: 50%;
      background: conic-gradient(from 40deg, transparent 0 18%, rgba(112,230,223,.12) 23%, transparent 30% 69%, rgba(189,253,115,.1) 73%, transparent 80%);
      animation: spin 16s linear infinite;
    }

    .spectrum { position: absolute; inset: 18%; animation: spin 24s linear infinite reverse; }

    .spectrum i {
      position: absolute;
      width: 2px;
      height: var(--h);
      left: calc(50% - 1px);
      top: 50%;
      border-radius: 4px;
      background: linear-gradient(to top, var(--violet), var(--cyan));
      transform-origin: 1px 0;
      transform: rotate(calc(var(--i) * 12deg)) translateY(56px);
      opacity: .7;
      transition: height .25s ease;
    }

    body.playing .spectrum i { animation: signal .55s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -35ms); }

    .core-play {
      z-index: 4;
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(237,240,255,.5);
      border-radius: 50%;
      background: rgba(7,9,17,.48);
      box-shadow: 0 0 0 9px rgba(7,9,17,.2);
      backdrop-filter: blur(8px);
      transition: transform .2s ease, background .2s ease;
    }

    .core-play:hover { transform: scale(1.08); background: rgba(167,139,250,.2); }
    .core-play svg { width: 29px; height: 29px; fill: var(--white); }
    .pause-icon, body.playing .play-icon { display: none; }
    body.playing .pause-icon { display: block; }

    .avatar-orbit {
      position: absolute;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(237,240,255,.45);
      border-radius: 50%;
      background: #191b2a;
      box-shadow: 0 0 0 5px rgba(7,9,17,.76), 0 0 24px rgba(112,230,223,.12);
      z-index: 5;
    }

    .avatar-orbit::before { content: ""; width: 13px; height: 13px; border-radius: 50%; background: var(--tone); transform: translateY(-7px); }
    .avatar-orbit::after { content: ""; position: absolute; width: 25px; height: 13px; border-radius: 50% 50% 35% 35%; background: var(--tone); bottom: 5px; }
    .avatar-orbit.a { --tone: var(--acid); left: 12%; top: 28%; }
    .avatar-orbit.b { --tone: var(--coral); right: 8%; top: 43%; }
    .avatar-orbit.c { --tone: var(--cyan); left: 33%; bottom: 9%; }

    .voice-stack { display: grid; gap: 16px; }

    .voice-node {
      height: 78px;
      display: grid;
      grid-template-columns: 48px 1fr 12px;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.025);
      transition: border-color .2s ease, transform .2s ease;
    }

    .voice-node:hover { transform: translateX(-4px); border-color: rgba(112,230,223,.42); }

    .face {
      width: 45px;
      height: 45px;
      overflow: hidden;
      position: relative;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 34%, var(--tone) 0 24%, #242738 25% 100%);
      box-shadow: 0 0 18px color-mix(in srgb, var(--tone), transparent 70%);
    }

    .voice-node:nth-child(1) { --tone: var(--violet); }
    .voice-node:nth-child(2) { --tone: var(--acid); }
    .voice-node:nth-child(3) { --tone: var(--coral); }
    .voice-node:nth-child(4) { --tone: var(--cyan); }

    .voice-wave { height: 30px; display: flex; align-items: center; gap: 3px; }
    .voice-wave i { width: 3px; height: var(--h); border-radius: 3px; background: var(--tone); opacity: .78; }
    body.playing .voice-node:first-child .voice-wave i { animation: signal .5s ease-in-out infinite alternate; animation-delay: calc(var(--n) * -60ms); }

    .level { width: 3px; height: 44px; border-radius: 8px; background: rgba(237,240,255,.11); position: relative; }
    .level::after { content: ""; position: absolute; bottom: 0; width: 100%; height: var(--level); border-radius: inherit; background: var(--tone); box-shadow: 0 0 7px var(--tone); }

    .dock {
      position: fixed;
      z-index: 12;
      left: calc(50% + 39px);
      bottom: 24px;
      width: min(660px, calc(100vw - 590px));
      min-width: 480px;
      height: 82px;
      display: grid;
      grid-template-columns: auto auto auto 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border: 1px solid rgba(237,240,255,.2);
      border-radius: 24px;
      background: rgba(13, 16, 27, .78);
      box-shadow: 0 18px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
      transform: translateX(-50%);
      backdrop-filter: blur(22px);
    }

    .dock .round-button { width: 42px; height: 42px; }
    .dock .main { width: 54px; height: 54px; color: var(--night); background: var(--acid); box-shadow: 0 0 22px rgba(189,253,115,.18); }
    .dock .main svg { fill: currentColor; stroke-width: 0; }

    .timeline {
      height: 44px;
      margin: 0 8px;
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
    }

    .timeline i { flex: 1; max-width: 4px; min-width: 2px; height: var(--h); border-radius: 4px; background: rgba(237,240,255,.22); transition: background .2s ease; }
    .timeline i:nth-child(-n+18) { background: linear-gradient(to top, var(--violet), var(--cyan)); }

    .mode-toggle {
      width: 43px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      position: relative;
    }

    .mode-toggle::after { content: ""; position: absolute; width: 18px; height: 18px; left: 4px; top: 3px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 9px var(--violet); transition: transform .25s ease, background .25s ease; }
    body.aurora .mode-toggle::after { transform: translateX(16px); background: var(--acid); }

    @keyframes twinkle { to { opacity: .12; transform: scale(.55); } }
    @keyframes dash { to { stroke-dashoffset: -100; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes halo { 50% { transform: scale(1.08); opacity: .65; } }
    @keyframes signal { to { height: calc(var(--h) * .32); opacity: .45; } }
    @keyframes satellite { to { transform: translateX(30px) scale(.72); opacity: .5; } }

    @media (max-width: 1120px) {
      .content { grid-template-columns: 170px minmax(430px, 1fr) 170px; }
      .queue, .voices { padding-inline: 15px; }
      .orbit-card { height: 80px; }
      .mini-planet { width: 52px; height: 52px; top: 13px; left: 12px; }
      .mini-planet::after { width: 66px; left: -7px; }
      .card-signal { left: 76px; }
      .voice-node { grid-template-columns: 42px 1fr; padding: 8px; }
      .face { width: 40px; height: 40px; }
      .level { display: none; }
      .dock { width: min(600px, calc(100vw - 470px)); min-width: 430px; }
    }

    @media (max-width: 820px) {
      body { overflow-y: auto; }
      .app { min-height: 100vh; height: auto; display: block; padding-bottom: 84px; }
      .rail { position: fixed; z-index: 20; left: 12px; right: 12px; bottom: 10px; height: 64px; padding: 8px 12px; flex-direction: row; justify-content: center; border: 1px solid var(--line); border-radius: 22px; }
      .brand { width: 40px; height: 40px; margin: 0 auto 0 0; }
      .rail-spacer { flex: 0; }
      .rail-button:nth-of-type(4) { display: none; }
      .surface { min-height: calc(100vh - 84px); grid-template-rows: 62px 1fr; }
      .topbar { padding: 0 15px; }
      .content { display: block; min-height: calc(100vh - 146px); }
      .queue, .voices { display: none; }
      .space { min-height: calc(100vh - 146px); }
      .orbit-system { width: min(92vw, 650px); }
      .dock { left: 50%; bottom: 90px; min-width: 0; width: calc(100% - 26px); height: 72px; padding: 8px 10px; }
    }

    @media (max-width: 500px) {
      .top-actions .round-button:first-child { display: none; }
      .dock { grid-template-columns: auto auto auto 1fr; gap: 2px; }
      .dock .mode-toggle { display: none; }
      .dock .round-button { width: 36px; height: 36px; }
      .dock .main { width: 50px; height: 50px; }
      .timeline { margin: 0 3px; }
      .avatar-orbit { width: 36px; height: 36px; }
      .spectrum i { transform: rotate(calc(var(--i) * 12deg)) translateY(42px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="app">
    <nav class="rail" aria-label="Primary navigation">
      <div class="brand" aria-hidden="true"><i></i></div>
      <button class="rail-button active" type="button" aria-label="Player">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>
      </button>
      <button class="rail-button" type="button" aria-label="Stories">
        <svg viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"/><path d="M8 17h10M8 8h6M8 11h7"/></svg>
      </button>
      <button class="rail-button" type="button" aria-label="Voices">
        <svg viewBox="0 0 24 24"><path d="M5 10v4M9 7v10M13 4v16M17 8v8M21 10v4"/></svg>
      </button>
      <button class="rail-button" type="button" aria-label="Archive">
        <svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-button" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A7 7 0 0 0 15 6l-.3-2.6h-4L10.4 6A7 7 0 0 0 8.8 7L6.4 6l-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.6 1l.3 2.6h4l.3-2.6a7 7 0 0 0 1.6-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1Z"/></svg>
      </button>
    </nav>

    <div class="surface">
      <header class="topbar">
        <div class="phase" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="top-actions">
          <button class="round-button" type="button" aria-label="Add story">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="round-button" type="button" aria-label="Search">
            <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          </button>
          <button class="round-button" type="button" aria-label="Change atmosphere" id="auroraButton">
            <svg viewBox="0 0 24 24"><path d="M4 15c3-8 5 4 8-4s5 4 8-4M4 19c3-6 5 3 8-3s5 3 8-3"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <aside class="queue" aria-label="Stories">
          <div class="queue-list">
            <button class="orbit-card active" type="button" aria-label="Story one"><span class="mini-planet"></span><span class="card-signal"><i style="--h:22%"></i><i style="--h:65%"></i><i style="--h:38%"></i><i style="--h:84%"></i><i style="--h:52%"></i><i style="--h:72%"></i><i style="--h:31%"></i><i style="--h:63%"></i><i style="--h:46%"></i></span></button>
            <button class="orbit-card" type="button" aria-label="Story two"><span class="mini-planet"></span><span class="card-signal"><i style="--h:48%"></i><i style="--h:28%"></i><i style="--h:78%"></i><i style="--h:42%"></i><i style="--h:91%"></i><i style="--h:34%"></i><i style="--h:58%"></i><i style="--h:76%"></i><i style="--h:30%"></i></span></button>
            <button class="orbit-card" type="button" aria-label="Story three"><span class="mini-planet"></span><span class="card-signal"><i style="--h:34%"></i><i style="--h:73%"></i><i style="--h:47%"></i><i style="--h:28%"></i><i style="--h:82%"></i><i style="--h:55%"></i><i style="--h:88%"></i><i style="--h:42%"></i><i style="--h:67%"></i></span></button>
            <button class="orbit-card" type="button" aria-label="Story four"><span class="mini-planet"></span><span class="card-signal"><i style="--h:75%"></i><i style="--h:39%"></i><i style="--h:59%"></i><i style="--h:86%"></i><i style="--h:33%"></i><i style="--h:70%"></i><i style="--h:48%"></i><i style="--h:91%"></i><i style="--h:41%"></i></span></button>
          </div>
        </aside>

        <section class="space" id="space">
          <svg class="constellation" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <defs><linearGradient id="constellationGradient"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#70e6df"/></linearGradient></defs>
            <path d="M4 25 18 16 31 30 48 12 67 28 83 17 97 34M8 73 26 58 42 77 61 62 76 81 94 69"/>
            <circle cx="18" cy="16" r=".8"/><circle cx="31" cy="30" r=".7"/><circle cx="48" cy="12" r=".9"/><circle cx="67" cy="28" r=".6"/><circle cx="83" cy="17" r=".8"/><circle cx="26" cy="58" r=".8"/><circle cx="42" cy="77" r=".6"/><circle cx="61" cy="62" r=".9"/><circle cx="76" cy="81" r=".7"/>
          </svg>
          <div class="orbit-system" id="orbitSystem">
            <div class="ring one"></div><div class="ring two"></div><div class="ring three"></div>
            <div class="halo"></div>
            <button class="avatar-orbit a" type="button" aria-label="Voice one"></button>
            <button class="avatar-orbit b" type="button" aria-label="Voice two"></button>
            <button class="avatar-orbit c" type="button" aria-label="Voice three"></button>
            <div class="core">
              <div class="spectrum" id="spectrum" aria-hidden="true"></div>
              <button class="core-play" type="button" aria-label="Play story" data-play>
                <svg class="play-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg>
                <svg class="pause-icon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></svg>
              </button>
            </div>
          </div>
        </section>

        <aside class="voices" aria-label="Voices">
          <div class="voice-stack">
            <button class="voice-node" type="button" aria-label="Voice one"><span class="face"></span><span class="voice-wave"><i style="--h:24%;--n:1"></i><i style="--h:70%;--n:2"></i><i style="--h:45%;--n:3"></i><i style="--h:88%;--n:4"></i><i style="--h:37%;--n:5"></i><i style="--h:65%;--n:6"></i></span><span class="level" style="--level:72%"></span></button>
            <button class="voice-node" type="button" aria-label="Voice two"><span class="face"></span><span class="voice-wave"><i style="--h:61%"></i><i style="--h:30%"></i><i style="--h:82%"></i><i style="--h:48%"></i><i style="--h:72%"></i><i style="--h:38%"></i></span><span class="level" style="--level:54%"></span></button>
            <button class="voice-node" type="button" aria-label="Voice three"><span class="face"></span><span class="voice-wave"><i style="--h:35%"></i><i style="--h:77%"></i><i style="--h:48%"></i><i style="--h:92%"></i><i style="--h:51%"></i><i style="--h:69%"></i></span><span class="level" style="--level:83%"></span></button>
            <button class="voice-node" type="button" aria-label="Voice four"><span class="face"></span><span class="voice-wave"><i style="--h:78%"></i><i style="--h:42%"></i><i style="--h:68%"></i><i style="--h:32%"></i><i style="--h:86%"></i><i style="--h:55%"></i></span><span class="level" style="--level:66%"></span></button>
          </div>
        </aside>
      </main>
    </div>
  </div>

  <div class="dock">
    <button class="round-button" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6Z"/></svg></button>
    <button class="round-button main" type="button" aria-label="Play story" data-play>
      <svg class="play-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg>
      <svg class="pause-icon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></svg>
    </button>
    <button class="round-button" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6Z"/></svg></button>
    <div class="timeline" role="slider" tabindex="0" aria-label="Story progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="47" id="timeline"></div>
    <button class="mode-toggle" type="button" aria-label="Change atmosphere" data-aurora></button>
  </div>

  <script>
    const stars = document.querySelector('#stars');
    const spectrum = document.querySelector('#spectrum');
    const timeline = document.querySelector('#timeline');

    for (let index = 0; index < 42; index += 1) {
      const star = document.createElement('i');
      star.className = 'star';
      star.style.left = `${(index * 37) % 97}%`;
      star.style.top = `${(index * 53) % 93}%`;
      star.style.setProperty('--o', `${.2 + (index % 7) / 10}`);
      star.style.setProperty('--d', `${1.8 + (index % 5) * .7}s`);
      stars.appendChild(star);
    }

    for (let index = 0; index < 30; index += 1) {
      const bar = document.createElement('i');
      bar.style.setProperty('--i', index);
      bar.style.setProperty('--h', `${8 + (index * 11) % 28}px`);
      spectrum.appendChild(bar);
    }

    for (let index = 0; index < 34; index += 1) {
      const bar = document.createElement('i');
      bar.style.setProperty('--h', `${18 + (index * 17) % 72}%`);
      timeline.appendChild(bar);
    }

    document.querySelectorAll('[data-play]').forEach((button) => button.addEventListener('click', () => {
      document.body.classList.toggle('playing');
    }));

    document.querySelectorAll('[data-aurora], #auroraButton').forEach((button) => button.addEventListener('click', () => {
      document.body.classList.toggle('aurora');
    }));

    const cards = document.querySelectorAll('.orbit-card');
    cards.forEach((card) => card.addEventListener('click', () => {
      cards.forEach((item) => item.classList.remove('active'));
      card.classList.add('active');
    }));

    const space = document.querySelector('#space');
    const orbitSystem = document.querySelector('#orbitSystem');
    space.addEventListener('pointermove', (event) => {
      const bounds = space.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width - .5;
      const y = (event.clientY - bounds.top) / bounds.height - .5;
      orbitSystem.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 7}deg)`;
    });
    space.addEventListener('pointerleave', () => { orbitSystem.style.transform = ''; });
  </script>
</body>
</html>
