<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Theatre</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #211d19;
      --paper: #f3ecde;
      --paper-deep: #e5d8c3;
      --rust: #c85a2d;
      --gold: #e3a838;
      --sage: #69765d;
      --shadow: 0 18px 50px rgba(64, 45, 28, .14);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.75), transparent 26rem),
        linear-gradient(135deg, #d8c9b2, #eee5d5 48%, #d4c1a7);
      font-family: Georgia, serif;
    }

    button {
      appearance: none;
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid var(--rust);
      outline-offset: 4px;
    }

    svg { display: block; }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    .shell {
      width: min(1480px, calc(100% - 40px));
      min-height: calc(100vh - 40px);
      margin: 20px auto;
      border: 1.5px solid var(--ink);
      background: rgba(243, 236, 222, .9);
      box-shadow: var(--shadow);
      position: relative;
      transition: background .5s ease;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      top: 17px;
      background: var(--paper-deep);
      box-shadow: inset 2px 2px 0 rgba(255,255,255,.55);
    }

    .shell::before { left: 18px; }
    .shell::after { right: 18px; }

    header {
      height: 74px;
      display: grid;
      grid-template-columns: 210px 1fr 210px;
      align-items: center;
      padding: 0 38px;
      border-bottom: 1.5px solid var(--ink);
    }

    .mark {
      width: 54px;
      height: 42px;
      position: relative;
    }

    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      inset: 5px 27px 2px 0;
      border: 1.5px solid var(--ink);
      border-radius: 2px 16px 2px 2px;
      background: var(--paper);
      transform: skewY(8deg);
    }

    .mark::after {
      inset: 5px 0 2px 27px;
      border-radius: 16px 2px 2px 2px;
      transform: skewY(-8deg);
    }

    .mark i {
      position: absolute;
      z-index: 2;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--rust);
      left: 24px;
      top: 4px;
      box-shadow: 0 12px 0 var(--gold), 0 24px 0 var(--sage);
    }

    .stitch {
      display: flex;
      justify-content: center;
      gap: 13px;
    }

    .stitch span {
      width: 29px;
      height: 8px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: transparent;
      transform: rotate(-8deg);
    }

    .stitch span:nth-child(2) { width: 52px; background: var(--rust); transform: rotate(3deg); }
    .stitch span:nth-child(3) { transform: rotate(7deg); }

    .header-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform .18s ease, box-shadow .18s ease, background .2s ease;
    }

    .icon-button:hover { transform: translate(-1px, -1px) rotate(-3deg); box-shadow: 4px 4px 0 var(--ink); }
    .icon-button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
    .icon-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .workspace {
      min-height: calc(100vh - 116px);
      display: grid;
      grid-template-columns: 210px minmax(420px, 1fr) 210px;
    }

    .library,
    .cast {
      padding: 27px 23px 120px;
      background: rgba(218, 203, 180, .32);
    }

    .library { border-right: 1.5px solid var(--ink); }
    .cast { border-left: 1.5px solid var(--ink); }

    .books {
      display: grid;
      gap: 17px;
    }

    .book {
      width: 100%;
      aspect-ratio: 1.24;
      padding: 0;
      overflow: hidden;
      position: relative;
      border: 1.5px solid var(--ink);
      border-radius: 2px;
      background: var(--paper-deep);
      box-shadow: 4px 5px 0 rgba(33,29,25,.2);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .book:hover { transform: rotate(-1deg) translateY(-3px); box-shadow: 7px 9px 0 rgba(33,29,25,.18); }
    .book.active { box-shadow: 5px 6px 0 var(--rust); }
    .book.active::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      right: 8px;
      top: 8px;
      background: var(--rust);
      border: 1px solid var(--ink);
      border-radius: 50%;
    }

    .book svg { width: 100%; height: 100%; }

    .add-book {
      min-height: 82px;
      display: grid;
      place-items: center;
      border: 1.5px dashed var(--ink);
      background: transparent;
      transition: background .2s ease;
    }

    .add-book:hover { background: rgba(255,255,255,.35); }
    .add-book svg { width: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; }

    .page-wrap {
      min-width: 0;
      padding: 28px 34px 130px;
      position: relative;
    }

    .paper {
      min-height: 620px;
      height: calc(100vh - 160px);
      max-height: 850px;
      overflow: hidden;
      position: relative;
      border: 1.5px solid var(--ink);
      background:
        linear-gradient(90deg, transparent 39px, rgba(200,90,45,.2) 40px, transparent 41px),
        repeating-linear-gradient(0deg, transparent 0 31px, rgba(33,29,25,.07) 32px),
        #f8f0e2;
      box-shadow: 9px 11px 0 rgba(33,29,25,.14);
      transform: rotate(.22deg);
    }

    .paper::before {
      content: "";
      position: absolute;
      z-index: 3;
      inset: 12px;
      border: 1px solid rgba(33,29,25,.25);
      pointer-events: none;
    }

    .scene {
      height: 58%;
      min-height: 330px;
      position: relative;
      overflow: hidden;
      border-bottom: 1.5px solid var(--ink);
      background: #e1cda9;
      transition: background .7s ease;
    }

    .sun {
      position: absolute;
      width: min(24vw, 250px);
      aspect-ratio: 1;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--rust);
      box-shadow: 0 0 0 16px rgba(200,90,45,.08), 0 0 0 32px rgba(200,90,45,.05);
      animation: breathe 7s ease-in-out infinite;
      transition: background .7s ease, transform .7s ease;
    }

    .sun::before,
    .sun::after {
      content: "";
      position: absolute;
      inset: 28%;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
    }

    .sun::after { inset: 43%; background: var(--gold); }

    .hill {
      position: absolute;
      width: 72%;
      height: 48%;
      bottom: -27%;
      border: 1.5px solid var(--ink);
      border-radius: 50% 50% 0 0;
      background: var(--sage);
    }

    .hill.one { left: -17%; transform: rotate(8deg); }
    .hill.two { right: -19%; bottom: -31%; background: #899077; transform: rotate(-9deg); }

    .bird {
      position: absolute;
      width: 38px;
      height: 16px;
      border-top: 1.5px solid var(--ink);
      border-radius: 50%;
      animation: drift 12s linear infinite;
    }

    .bird::after {
      content: "";
      position: absolute;
      left: 19px;
      top: -1.5px;
      width: 38px;
      height: 16px;
      border-top: 1.5px solid var(--ink);
      border-radius: 50%;
    }

    .bird.a { top: 18%; left: 14%; }
    .bird.b { top: 29%; left: 72%; animation-delay: -6s; transform: scale(.65); }

    .hero-play {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 48%;
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      box-shadow: 5px 6px 0 var(--ink);
      transform: translate(-50%, -50%);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .hero-play:hover { transform: translate(-50%, -54%) rotate(-4deg); box-shadow: 7px 9px 0 var(--ink); }
    .hero-play svg { width: 28px; height: 28px; fill: var(--ink); }
    .hero-play .pause-icon, body.playing .hero-play .play-icon { display: none; }
    body.playing .hero-play .pause-icon { display: block; }

    .story-lines {
      height: 42%;
      padding: 36px 58px 25px 68px;
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .line {
      height: 6px;
      border-radius: 9px;
      background: var(--ink);
      opacity: .72;
    }

    .line:nth-child(2) { width: 83%; }
    .line:nth-child(3) { width: 92%; }
    .line:nth-child(4) { width: 61%; }
    .line:nth-child(5) { width: 76%; margin-left: 9%; background: var(--rust); }
    .line:nth-child(6) { width: 69%; margin-left: 9%; }

    .scribble {
      width: 80px;
      height: 28px;
      margin-top: 5px;
      border-bottom: 2px solid var(--ink);
      border-radius: 50%;
      transform: rotate(-7deg);
      opacity: .45;
    }

    .cast-list { display: grid; gap: 19px; }

    .voice {
      display: grid;
      grid-template-columns: 50px 1fr;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 0;
      background: transparent;
      text-align: left;
    }

    .portrait {
      width: 50px;
      height: 57px;
      overflow: hidden;
      position: relative;
      border: 1.5px solid var(--ink);
      border-radius: 50% 50% 44% 44%;
      background: var(--gold);
      transition: transform .2s ease;
    }

    .voice:hover .portrait { transform: rotate(5deg) scale(1.04); }
    .voice.active .portrait { box-shadow: 3px 4px 0 var(--rust); }
    .portrait::before { content: ""; position: absolute; width: 24px; height: 28px; border: 1.5px solid var(--ink); border-radius: 50%; left: 12px; top: 12px; background: var(--paper); }
    .portrait::after { content: ""; position: absolute; width: 42px; height: 25px; border: 1.5px solid var(--ink); border-radius: 50% 50% 0 0; left: 3px; bottom: -10px; background: var(--rust); }
    .voice:nth-child(2) .portrait { background: #aeb89a; }
    .voice:nth-child(2) .portrait::after { background: #5e6a54; }
    .voice:nth-child(3) .portrait { background: #c5b1a5; }
    .voice:nth-child(3) .portrait::after { background: #86634f; }
    .voice:nth-child(4) .portrait { background: #d4a66b; }
    .voice:nth-child(4) .portrait::after { background: #3d5660; }

    .meter { height: 34px; display: flex; align-items: center; gap: 3px; }
    .meter i { display: block; width: 3px; height: 22%; border-radius: 3px; background: var(--ink); animation: meter 1.1s ease-in-out infinite alternate; animation-play-state: paused; }
    .meter i:nth-child(2) { animation-delay: -.3s; height: 55%; }
    .meter i:nth-child(3) { animation-delay: -.7s; height: 88%; }
    .meter i:nth-child(4) { animation-delay: -.45s; height: 38%; }
    .meter i:nth-child(5) { animation-delay: -.2s; height: 70%; }
    .meter i:nth-child(6) { animation-delay: -.55s; height: 28%; }
    body.playing .voice.active .meter i { animation-play-state: running; }

    .transport {
      position: fixed;
      z-index: 15;
      width: min(760px, calc(100% - 80px));
      height: 86px;
      left: 50%;
      bottom: 33px;
      display: grid;
      grid-template-columns: auto auto auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border: 1.5px solid var(--ink);
      background: rgba(248, 240, 226, .96);
      box-shadow: 7px 8px 0 var(--ink);
      transform: translateX(-50%) rotate(-.25deg);
      backdrop-filter: blur(10px);
    }

    .transport .icon-button { box-shadow: none; background: transparent; }
    .transport .main-control { width: 54px; height: 54px; background: var(--rust); }
    .transport .main-control svg { fill: var(--paper); stroke: var(--paper); }
    .transport .pause-icon, body.playing .transport .play-icon { display: none; }
    body.playing .transport .pause-icon { display: block; }

    .track {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 0 13px;
      position: relative;
      cursor: pointer;
    }

    .track::before {
      content: "";
      position: absolute;
      height: 1.5px;
      left: 9px;
      right: 9px;
      top: 50%;
      background: var(--ink);
      opacity: .32;
    }

    .track i {
      z-index: 1;
      flex: 1;
      height: var(--h);
      max-width: 5px;
      min-width: 2px;
      border-radius: 5px;
      background: var(--ink);
      transform-origin: center;
      transition: background .2s ease;
    }

    .track i:nth-child(-n+14) { background: var(--rust); }

    .knob {
      width: 24px;
      height: 24px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--gold);
      position: relative;
    }

    .knob::after { content: ""; position: absolute; width: 1.5px; height: 8px; left: 10px; top: 2px; background: var(--ink); transform: rotate(35deg); transform-origin: bottom; }

    body.dusk .scene { background: #776d68; }
    body.dusk .sun { background: #3d5660; transform: translate(-50%, -50%) scale(.86); }
    body.dusk .sun::after { background: var(--paper); }

    body.playing .sun { animation-duration: 2.4s; }

    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 16px rgba(200,90,45,.08), 0 0 0 32px rgba(200,90,45,.05); }
      50% { box-shadow: 0 0 0 22px rgba(200,90,45,.05), 0 0 0 48px rgba(200,90,45,.025); }
    }

    @keyframes drift {
      0% { translate: -16px 0; }
      50% { translate: 20px -8px; }
      100% { translate: -16px 0; }
    }

    @keyframes meter { to { height: 100%; } }

    @media (max-width: 1050px) {
      .workspace { grid-template-columns: 150px minmax(400px, 1fr) 150px; }
      .library, .cast { padding-inline: 16px; }
      header { grid-template-columns: 150px 1fr 150px; }
      .voice { grid-template-columns: 44px 1fr; gap: 8px; }
      .portrait { width: 44px; height: 51px; }
      .portrait::before { left: 9px; }
    }

    @media (max-width: 800px) {
      .shell { width: 100%; min-height: 100vh; margin: 0; border-width: 0; }
      header { height: 66px; padding: 0 18px; grid-template-columns: 1fr auto; border-top: 1.5px solid var(--ink); }
      .stitch { display: none; }
      .workspace { display: block; }
      .library { border-right: 0; border-bottom: 1.5px solid var(--ink); padding: 15px 18px; overflow-x: auto; }
      .books { display: flex; gap: 12px; }
      .book { flex: 0 0 118px; }
      .add-book { flex: 0 0 86px; min-height: 72px; }
      .page-wrap { padding: 22px 18px 160px; }
      .paper { height: 650px; min-height: 0; }
      .cast { display: none; }
      .sun { width: 190px; }
      .transport { bottom: 20px; width: calc(100% - 30px); grid-template-columns: auto auto 1fr auto; height: 78px; padding: 10px; }
      .transport > :nth-child(3) { display: none; }
      .track { padding-inline: 5px; }
      .story-lines { padding-inline: 54px 30px; }
    }

    @media (max-width: 470px) {
      .paper { height: 570px; }
      .scene { min-height: 290px; }
      .story-lines { padding: 33px 28px 20px 52px; }
      .transport { gap: 5px; }
      .transport .icon-button:not(.main-control) { width: 34px; height: 34px; }
      .knob { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="shell">
    <header>
      <div class="mark" aria-hidden="true"><i></i></div>
      <div class="stitch" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="header-actions">
        <button class="icon-button" type="button" aria-label="Change scene" id="sceneToggle">
          <svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
        </button>
        <button class="icon-button" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="library" aria-label="Stories">
        <div class="books">
          <button class="book active" type="button" aria-label="Story one">
            <svg viewBox="0 0 160 128" aria-hidden="true"><rect width="160" height="128" fill="#d9c5a6"/><circle cx="80" cy="53" r="29" fill="#c85a2d" stroke="#211d19" stroke-width="2"/><path d="M0 93 42 57l31 35 25-22 62 40v18H0Z" fill="#69765d" stroke="#211d19" stroke-width="2"/><path d="M20 105h119M31 114h81" stroke="#211d19" stroke-width="3"/></svg>
          </button>
          <button class="book" type="button" aria-label="Story two">
            <svg viewBox="0 0 160 128" aria-hidden="true"><rect width="160" height="128" fill="#c9b8ae"/><path d="M80 14 105 48 80 82 55 48Z" fill="#e3a838" stroke="#211d19" stroke-width="2"/><circle cx="80" cy="48" r="9" fill="#f3ecde" stroke="#211d19" stroke-width="2"/><path d="M10 103c29-29 49 17 70-8s45-12 70 8" fill="none" stroke="#211d19" stroke-width="3"/><path d="M22 113h116" stroke="#c85a2d" stroke-width="7"/></svg>
          </button>
          <button class="book" type="button" aria-label="Story three">
            <svg viewBox="0 0 160 128" aria-hidden="true"><rect width="160" height="128" fill="#8d987d"/><path d="M80 8c9 30 37 38 58 43-20 8-44 21-58 66-14-45-38-58-58-66 21-5 49-13 58-43Z" fill="#f3ecde" stroke="#211d19" stroke-width="2"/><circle cx="80" cy="54" r="17" fill="#3d5660" stroke="#211d19" stroke-width="2"/><path d="m72 54 6 6 12-14" fill="none" stroke="#f3ecde" stroke-width="3"/></svg>
          </button>
          <button class="add-book" type="button" aria-label="Add story">
            <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
          </button>
        </div>
      </aside>

      <section class="page-wrap">
        <article class="paper">
          <div class="scene">
            <div class="sun"></div>
            <div class="bird a"></div>
            <div class="bird b"></div>
            <div class="hill one"></div>
            <div class="hill two"></div>
            <button class="hero-play" type="button" aria-label="Play story" data-play>
              <svg class="play-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg>
              <svg class="pause-icon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></svg>
            </button>
          </div>
          <div class="story-lines" aria-hidden="true">
            <div class="line"></div><div class="line"></div><div class="line"></div>
            <div class="line"></div><div class="line"></div><div class="line"></div>
            <div class="scribble"></div>
          </div>
        </article>
      </section>

      <aside class="cast" aria-label="Voices">
        <div class="cast-list">
          <button class="voice active" type="button" aria-label="Voice one"><span class="portrait"></span><span class="meter"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
          <button class="voice" type="button" aria-label="Voice two"><span class="portrait"></span><span class="meter"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
          <button class="voice" type="button" aria-label="Voice three"><span class="portrait"></span><span class="meter"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
          <button class="voice" type="button" aria-label="Voice four"><span class="portrait"></span><span class="meter"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
        </div>
      </aside>
    </main>
  </div>

  <div class="transport">
    <button class="icon-button" type="button" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6Z"/></svg>
    </button>
    <button class="icon-button main-control" type="button" aria-label="Play story" data-play>
      <svg class="play-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg>
      <svg class="pause-icon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></svg>
    </button>
    <button class="icon-button" type="button" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6Z"/></svg>
    </button>
    <div class="track" role="slider" tabindex="0" aria-label="Story progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42">
      <i style="--h:18%"></i><i style="--h:42%"></i><i style="--h:70%"></i><i style="--h:35%"></i><i style="--h:90%"></i><i style="--h:58%"></i><i style="--h:28%"></i><i style="--h:78%"></i><i style="--h:45%"></i><i style="--h:82%"></i><i style="--h:33%"></i><i style="--h:64%"></i><i style="--h:95%"></i><i style="--h:54%"></i><i style="--h:24%"></i><i style="--h:68%"></i><i style="--h:86%"></i><i style="--h:38%"></i><i style="--h:72%"></i><i style="--h:48%"></i><i style="--h:88%"></i><i style="--h:30%"></i><i style="--h:60%"></i><i style="--h:76%"></i>
    </div>
    <button class="knob" type="button" aria-label="Volume"></button>
  </div>

  <script>
    const playButtons = document.querySelectorAll('[data-play]');
    const storyButtons = document.querySelectorAll('.book');
    const voiceButtons = document.querySelectorAll('.voice');

    playButtons.forEach((button) => button.addEventListener('click', () => {
      document.body.classList.toggle('playing');
    }));

    storyButtons.forEach((button) => button.addEventListener('click', () => {
      storyButtons.forEach((item) => item.classList.remove('active'));
      button.classList.add('active');
    }));

    voiceButtons.forEach((button) => button.addEventListener('click', () => {
      voiceButtons.forEach((item) => item.classList.remove('active'));
      button.classList.add('active');
    }));

    document.querySelector('#sceneToggle').addEventListener('click', () => {
      document.body.classList.toggle('dusk');
    });
  </script>
</body>
</html>
