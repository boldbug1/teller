<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moss Listening Room</title>
  <style>
    :root {
      color-scheme: dark;
      --forest: #13231b;
      --forest-deep: #09140f;
      --moss: #607a47;
      --moss-light: #9aac6d;
      --cream: #eee6c8;
      --sun: #efb85b;
      --berry: #bd6657;
      --water: #426e6b;
      --line: rgba(238, 230, 200, .24);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--cream);
      background:
        radial-gradient(circle at 50% 5%, rgba(154,172,109,.14), transparent 30rem),
        linear-gradient(155deg, #17291f, var(--forest-deep));
      font-family: Georgia, serif;
      transition: background 1s ease;
    }

    body.dawn {
      background:
        radial-gradient(circle at 52% -5%, rgba(239,184,91,.32), transparent 35rem),
        linear-gradient(155deg, #35482d, #14261d);
    }

    button {
      appearance: none;
      border: 0;
      padding: 0;
      color: inherit;
      background: none;
      cursor: pointer;
      font: inherit;
    }

    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--sun); outline-offset: 4px; }
    svg { display: block; }

    .app {
      height: 100vh;
      min-height: 670px;
      display: grid;
      grid-template-columns: 98px 1fr 220px;
      grid-template-rows: 80px 1fr;
      position: relative;
      isolation: isolate;
    }

    .app::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.55' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .canopy {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      overflow: hidden;
    }

    .branch {
      position: absolute;
      width: 37vw;
      height: 190px;
      border-bottom: 34px solid #0b1711;
      border-radius: 50%;
      top: -80px;
    }

    .branch.left { left: -8vw; transform: rotate(8deg); }
    .branch.right { right: -7vw; transform: scaleX(-1) rotate(5deg); }

    .leaf {
      position: absolute;
      width: var(--w);
      height: calc(var(--w) * .54);
      border: 1px solid rgba(238,230,200,.16);
      border-radius: 100% 0 100% 0;
      background: var(--tone);
      transform: rotate(var(--r));
      transform-origin: 0 50%;
      animation: sway var(--d) ease-in-out infinite alternate;
    }

    .leaf-a { left: 4%; top: 5%; }
    .leaf-b { left: 14%; top: 2%; }
    .leaf-c { right: 5%; top: 4%; }
    .leaf-d { right: 16%; top: 1%; }
    .leaf-e { left: 1%; bottom: 12%; }
    .leaf-f { right: 2%; bottom: 7%; }

    .firefly {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #f8db76;
      box-shadow: 0 0 8px 3px rgba(248,219,118,.38);
      animation: fly var(--d) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 98px 1fr 220px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: rgba(9,20,15,.52);
      backdrop-filter: blur(14px);
      z-index: 10;
    }

    .mark {
      width: 98px;
      height: 80px;
      display: grid;
      place-items: center;
      border-right: 1px solid var(--line);
    }

    .mark-shape {
      width: 47px;
      height: 47px;
      border: 1px solid var(--cream);
      border-radius: 55% 45% 50% 50%;
      position: relative;
      transform: rotate(-8deg);
    }

    .mark-shape::before,
    .mark-shape::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 9px;
      top: 18px;
      border-top: 2px solid var(--sun);
      border-radius: 50%;
    }

    .mark-shape::before { left: 3px; transform: rotate(14deg); }
    .mark-shape::after { right: 3px; transform: rotate(-14deg); }

    .trail {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .trail i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1px solid rgba(238,230,200,.5);
      position: relative;
    }

    .trail i:not(:last-child)::after { content: ""; position: absolute; width: 14px; height: 1px; left: 6px; top: 2px; background: rgba(238,230,200,.3); transform: rotate(-9deg); }
    .trail i:nth-child(3) { width: 34px; border-radius: 50%; background: var(--moss); border-color: var(--moss-light); }

    .top-tools {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-left: 1px solid var(--line);
    }

    .round-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 48% 52% 46% 54%;
      background: rgba(238,230,200,.04);
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .round-button:nth-child(even) { border-radius: 56% 44% 52% 48%; }
    .round-button:hover { transform: translateY(-3px) rotate(5deg); background: rgba(154,172,109,.15); border-color: var(--moss-light); }
    .round-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    .story-rail {
      grid-row: 2;
      padding: 24px 0 115px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      border-right: 1px solid var(--line);
      background: rgba(9,20,15,.35);
      backdrop-filter: blur(10px);
      z-index: 7;
    }

    .seed {
      width: 57px;
      height: 69px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(238,230,200,.32);
      border-radius: 58% 42% 48% 52% / 42% 51% 49% 58%;
      background: var(--tone);
      box-shadow: inset -7px -8px 16px rgba(0,0,0,.24);
      transition: transform .25s ease, border-color .25s ease;
    }

    .seed:nth-child(1) { --tone: #7a8c52; transform: rotate(-5deg); }
    .seed:nth-child(2) { --tone: #9a5e4e; transform: rotate(6deg); }
    .seed:nth-child(3) { --tone: #456b67; transform: rotate(-3deg); }
    .seed:nth-child(4) { --tone: #a98a55; transform: rotate(4deg); }
    .seed:hover { transform: scale(1.08) rotate(0); border-color: var(--cream); }
    .seed.active { border-color: var(--sun); box-shadow: 0 0 0 4px rgba(239,184,91,.12), inset -7px -8px 16px rgba(0,0,0,.24); }

    .seed::before { content: ""; position: absolute; width: 36px; height: 36px; left: 10px; top: 15px; border: 1px solid var(--cream); border-radius: 50%; opacity: .72; }
    .seed::after { content: ""; position: absolute; width: 1px; height: 45px; left: 28px; top: 12px; background: var(--cream); transform: rotate(34deg); opacity: .62; }

    .add-seed { width: 50px; height: 50px; display: grid; place-items: center; border: 1px dashed rgba(238,230,200,.42); border-radius: 50%; }
    .add-seed svg { width: 21px; stroke: var(--cream); stroke-width: 1.5; }

    .room {
      min-width: 0;
      min-height: 0;
      grid-row: 2;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .scene {
      width: min(88%, 1000px);
      height: min(78vh, 730px);
      min-height: 540px;
      position: relative;
      border: 1px solid rgba(238,230,200,.18);
      border-radius: 50% 50% 12% 12% / 22% 22% 8% 8%;
      background:
        radial-gradient(circle at 51% 23%, rgba(239,184,91,.16), transparent 22%),
        linear-gradient(to bottom, rgba(66,110,107,.22), rgba(19,35,27,.2) 58%, rgba(9,20,15,.8));
      box-shadow: inset 0 0 80px rgba(9,20,15,.52), 0 30px 90px rgba(0,0,0,.24);
      overflow: hidden;
    }

    .moon {
      position: absolute;
      width: 150px;
      height: 150px;
      left: calc(50% - 75px);
      top: 8%;
      border-radius: 50%;
      background: var(--cream);
      box-shadow: 0 0 50px rgba(238,230,200,.22);
      opacity: .86;
      transition: background .8s ease, transform .8s ease;
    }

    .moon::after { content: ""; position: absolute; width: 120px; height: 120px; left: 42px; top: -14px; border-radius: 50%; background: #23382c; transition: transform .8s ease, opacity .8s ease; }
    body.dawn .moon { background: var(--sun); transform: translateY(22px) scale(.84); }
    body.dawn .moon::after { opacity: 0; transform: translate(45px,-30px); }

    .mountains {
      position: absolute;
      inset: 26% 0 auto;
      width: 100%;
      height: 40%;
      opacity: .9;
    }

    .mountains path:nth-child(1) { fill: #314d3c; }
    .mountains path:nth-child(2) { fill: #253b2f; }
    .mountains path:nth-child(3) { fill: #1b2e24; }

    .tree {
      position: absolute;
      bottom: 12%;
      width: 105px;
      height: 330px;
      border-radius: 48% 52% 10% 10%;
      background: linear-gradient(90deg, #142019, #294231 45%, #101b14);
      transform-origin: bottom;
    }

    .tree::before,
    .tree::after { content: ""; position: absolute; width: 190px; height: 95px; top: -18px; border-radius: 50%; background: #273e2e; box-shadow: 30px -24px 0 #334c35, -20px -47px 0 #1c3326; }
    .tree::before { left: -75px; }
    .tree::after { right: -75px; transform: scale(.76); opacity: .82; }
    .tree.left { left: -21px; transform: rotate(5deg); }
    .tree.right { right: -26px; transform: rotate(-5deg) scaleX(-1); }

    .ground {
      position: absolute;
      width: 115%;
      height: 27%;
      left: -7%;
      bottom: -12%;
      border: 1px solid rgba(238,230,200,.14);
      border-radius: 50% 50% 0 0;
      background: #182b20;
      box-shadow: inset 0 20px 45px rgba(96,122,71,.16);
    }

    .pond {
      position: absolute;
      z-index: 3;
      width: 56%;
      height: 14%;
      left: 22%;
      bottom: 7%;
      border: 1px solid rgba(238,230,200,.25);
      border-radius: 50%;
      background: rgba(66,110,107,.55);
      box-shadow: inset 0 10px 25px rgba(9,20,15,.55), 0 0 30px rgba(66,110,107,.15);
    }

    .pond::before,
    .pond::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(238,230,200,.24);
      border-radius: 50%;
      opacity: 0;
    }

    .pond::before { inset: 28% 30%; }
    .pond::after { inset: 39% 40%; }
    body.playing .pond::before { animation: ripple 2.6s ease-out infinite; }
    body.playing .pond::after { animation: ripple 2.6s 1.1s ease-out infinite; }

    .book {
      position: absolute;
      z-index: 5;
      width: min(56%, 500px);
      height: 190px;
      left: 50%;
      bottom: 13%;
      transform: translateX(-50%);
      filter: drop-shadow(0 18px 18px rgba(0,0,0,.35));
    }

    .page {
      position: absolute;
      width: 51%;
      height: 100%;
      top: 0;
      border: 1px solid #bcb394;
      background: linear-gradient(105deg, #d5ccb0, var(--cream) 22% 84%, #c8bea0);
    }

    .page.left { left: 0; border-radius: 14% 3% 8% 16% / 10% 4% 12% 11%; transform: perspective(400px) rotateY(7deg) rotate(-2deg); transform-origin: right; }
    .page.right { right: 0; border-radius: 3% 14% 16% 8% / 4% 10% 11% 12%; transform: perspective(400px) rotateY(-7deg) rotate(2deg); transform-origin: left; }

    .page-lines { position: absolute; inset: 35px 25px; display: grid; align-content: start; gap: 10px; }
    .page-lines i { height: 3px; border-radius: 4px; background: #40523a; opacity: .65; }
    .page-lines i:nth-child(2) { width: 79%; }
    .page-lines i:nth-child(3) { width: 90%; }
    .page-lines i:nth-child(4) { width: 61%; background: var(--berry); }
    .page-lines i:nth-child(5) { width: 84%; }

    .book-wave {
      position: absolute;
      z-index: 6;
      left: 17%;
      right: 17%;
      top: 72px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      pointer-events: none;
    }

    .book-wave i { width: 3px; height: var(--h); border-radius: 5px; background: #40523a; transform-origin: center; }
    body.playing .book-wave i { animation: voice .8s ease-in-out infinite alternate; animation-delay: calc(var(--n) * -70ms); }

    .book-play {
      position: absolute;
      z-index: 8;
      width: 70px;
      height: 70px;
      left: 50%;
      top: -34px;
      display: grid;
      place-items: center;
      border: 1px solid #bcb394;
      border-radius: 48% 52% 44% 56%;
      background: var(--berry);
      box-shadow: 0 7px 18px rgba(0,0,0,.26);
      transform: translateX(-50%) rotate(-3deg);
      transition: transform .2s ease, background .2s ease;
    }

    .book-play:hover { transform: translateX(-50%) translateY(-4px) rotate(4deg) scale(1.05); background: #ca7564; }
    .book-play svg { width: 28px; height: 28px; fill: var(--cream); }
    .pause-icon, body.playing .play-icon { display: none; }
    body.playing .pause-icon { display: block; }

    .cast {
      grid-row: 2;
      padding: 27px 20px 120px;
      border-left: 1px solid var(--line);
      background: rgba(9,20,15,.35);
      backdrop-filter: blur(10px);
      z-index: 7;
    }

    .cast-list { display: grid; gap: 20px; }

    .spirit {
      width: 100%;
      height: 86px;
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: center;
      gap: 13px;
      position: relative;
      text-align: left;
    }

    .spirit::after { content: ""; position: absolute; left: 70px; right: 0; bottom: 3px; height: 1px; background: var(--line); }

    .spirit-face {
      width: 58px;
      height: 67px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(238,230,200,.38);
      border-radius: 50% 50% 46% 54%;
      background: var(--tone);
      box-shadow: inset -7px -8px 13px rgba(0,0,0,.23);
      transition: transform .2s ease;
    }

    .spirit:hover .spirit-face { transform: rotate(5deg) translateY(-3px); }
    .spirit:nth-child(1) { --tone: #8b704a; }
    .spirit:nth-child(2) { --tone: #526d45; }
    .spirit:nth-child(3) { --tone: #7b5350; }
    .spirit:nth-child(4) { --tone: #456b67; }
    .spirit-face::before { content: ""; position: absolute; width: 34px; height: 37px; left: 11px; top: 15px; border-radius: 48%; background: #d6c8a4; }
    .spirit-face::after { content: ""; position: absolute; width: 38px; height: 22px; left: 9px; top: 8px; border-radius: 50%; background: #25382b; transform: rotate(-6deg); }

    .spirit-wave { height: 37px; display: flex; align-items: center; gap: 4px; }
    .spirit-wave i { width: 3px; height: var(--h); border-radius: 4px; background: var(--moss-light); opacity: .72; }
    body.playing .spirit:first-child .spirit-wave i { animation: voice .7s ease-in-out infinite alternate; animation-delay: calc(var(--n) * -80ms); }

    .player {
      position: fixed;
      z-index: 20;
      width: min(700px, calc(100vw - 430px));
      min-width: 480px;
      height: 82px;
      left: calc(50% - 61px);
      bottom: 24px;
      display: grid;
      grid-template-columns: auto auto auto 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 11px 15px;
      border: 1px solid rgba(238,230,200,.28);
      border-radius: 45% 55% 48% 52% / 16% 20% 20% 16%;
      background: rgba(22,39,29,.9);
      box-shadow: 0 20px 50px rgba(0,0,0,.32), inset 0 1px 0 rgba(238,230,200,.06);
      transform: translateX(-50%);
      backdrop-filter: blur(18px);
    }

    .player .round-button { width: 40px; height: 40px; }
    .player .main-control { width: 54px; height: 54px; border-color: rgba(238,230,200,.5); background: var(--cream); color: var(--forest); }
    .player .main-control svg { fill: currentColor; stroke: currentColor; }

    .river {
      min-width: 0;
      height: 50px;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 0 11px;
      position: relative;
      cursor: pointer;
    }

    .river::before { content: ""; position: absolute; left: 7px; right: 7px; top: 50%; height: 1px; background: rgba(238,230,200,.24); }
    .river i { z-index: 1; flex: 1; min-width: 2px; max-width: 5px; height: var(--h); border-radius: 50%; background: rgba(238,230,200,.3); }
    .river i:nth-child(-n+16) { background: var(--sun); }

    .sound-stone {
      width: 36px;
      height: 31px;
      border: 1px solid var(--line);
      border-radius: 52% 48% 56% 44%;
      background: var(--moss);
      position: relative;
    }

    .sound-stone::after { content: ""; position: absolute; width: 2px; height: 11px; left: 16px; top: 4px; border-radius: 2px; background: var(--cream); transform: rotate(29deg); transform-origin: bottom; }

    @keyframes sway { to { transform: rotate(calc(var(--r) + 8deg)) scale(.97); } }
    @keyframes fly { to { transform: translate(42px,-31px); opacity: .28; } }
    @keyframes ripple { 0% { opacity: .8; transform: scale(.2); } 100% { opacity: 0; transform: scale(3.8); } }
    @keyframes voice { to { height: calc(var(--h) * .32); opacity: .46; } }

    @media (max-width: 1080px) {
      .app { grid-template-columns: 82px 1fr 175px; }
      .topbar { grid-template-columns: 82px 1fr 175px; }
      .mark { width: 82px; }
      .story-rail { padding-inline: 10px; }
      .cast { padding-inline: 13px; }
      .spirit { grid-template-columns: 49px 1fr; gap: 9px; }
      .spirit-face { width: 49px; height: 59px; }
      .spirit-face::before { left: 7px; }
      .spirit-face::after { left: 5px; }
      .spirit::after { left: 58px; }
      .player { width: min(620px, calc(100vw - 360px)); left: calc(50% - 46px); }
      .book { width: 65%; }
    }

    @media (max-width: 790px) {
      body { overflow-y: auto; }
      .app { min-height: 100vh; height: auto; display: grid; grid-template-columns: 1fr; grid-template-rows: 68px 92px minmax(650px, calc(100vh - 160px)); padding-bottom: 90px; }
      .topbar { position: sticky; top: 0; grid-column: 1; grid-row: 1; grid-template-columns: 76px 1fr auto; height: 68px; }
      .mark { width: 76px; height: 68px; }
      .mark-shape { transform: scale(.82) rotate(-8deg); }
      .top-tools { height: 68px; padding-inline: 9px; border-left: 1px solid var(--line); }
      .top-tools .round-button:first-child { display: none; }
      .trail { gap: 9px; }
      .story-rail { grid-column: 1; grid-row: 2; padding: 11px 15px; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .seed { flex: 0 0 54px; height: 66px; }
      .add-seed { flex: 0 0 46px; }
      .room { grid-column: 1; grid-row: 3; min-height: 650px; }
      .scene { width: calc(100% - 24px); height: 610px; min-height: 0; }
      .cast { display: none; }
      .player { left: 50%; bottom: 14px; min-width: 0; width: calc(100% - 24px); height: 72px; }
      .book { width: min(76%, 500px); }
    }

    @media (max-width: 500px) {
      .app { grid-template-rows: 62px 84px minmax(570px, calc(100vh - 146px)); }
      .topbar, .mark, .top-tools { height: 62px; }
      .trail i:nth-child(1), .trail i:nth-child(5) { display: none; }
      .scene { height: 545px; border-radius: 45% 45% 8% 8% / 16% 16% 6% 6%; }
      .moon { width: 110px; height: 110px; left: calc(50% - 55px); }
      .moon::after { width: 88px; height: 88px; left: 32px; }
      .tree { transform: scale(.78) rotate(5deg); transform-origin: bottom left; }
      .tree.right { transform: scale(.78) rotate(-5deg) scaleX(-1); transform-origin: bottom right; }
      .book { width: 88%; height: 165px; bottom: 15%; }
      .page-lines { inset: 31px 18px; gap: 8px; }
      .book-wave { left: 14%; right: 14%; top: 65px; gap: 3px; }
      .book-play { width: 58px; height: 58px; top: -28px; }
      .player { grid-template-columns: auto auto 1fr; gap: 4px; padding: 8px; }
      .player > .round-button:nth-child(3), .sound-stone { display: none; }
      .river { padding-inline: 4px; gap: 2px; }
      .player .round-button { width: 37px; height: 37px; }
      .player .main-control { width: 50px; height: 50px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="canopy" id="canopy">
    <div class="branch left"></div><div class="branch right"></div>
    <i class="leaf leaf-a" style="--w:76px;--tone:#2c4935;--r:23deg;--d:4.2s"></i>
    <i class="leaf leaf-b" style="--w:62px;--tone:#46603d;--r:67deg;--d:5.1s"></i>
    <i class="leaf leaf-c" style="--w:91px;--tone:#263f30;--r:121deg;--d:4.7s"></i>
    <i class="leaf leaf-d" style="--w:58px;--tone:#607a47;--r:158deg;--d:5.6s"></i>
    <i class="leaf leaf-e" style="--w:70px;--tone:#334f38;--r:-18deg;--d:4.9s"></i>
    <i class="leaf leaf-f" style="--w:82px;--tone:#293f30;--r:201deg;--d:5.3s"></i>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="mark"><div class="mark-shape" aria-hidden="true"></div></div>
      <div class="trail" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="top-tools">
        <button class="round-button" type="button" aria-label="Add story"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button>
        <button class="round-button" type="button" aria-label="Change light" id="lightButton"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg></button>
        <button class="round-button" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A7 7 0 0 0 15 6l-.3-2.6h-4L10.4 6A7 7 0 0 0 8.8 7L6.4 6l-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.6 1l.3 2.6h4l.3-2.6a7 7 0 0 0 1.6-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1Z"/></svg></button>
      </div>
    </header>

    <nav class="story-rail" aria-label="Stories">
      <button class="seed active" type="button" aria-label="Story one"></button>
      <button class="seed" type="button" aria-label="Story two"></button>
      <button class="seed" type="button" aria-label="Story three"></button>
      <button class="seed" type="button" aria-label="Story four"></button>
      <button class="add-seed" type="button" aria-label="Add story"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button>
    </nav>

    <main class="room">
      <section class="scene">
        <div class="moon"></div>
        <svg class="mountains" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 180 130 73l102 82L361 34l132 129L622 61l115 98 117-79 146 108v112H0Z"/>
          <path d="M0 220 171 121l104 86 144-104 145 111 124-81 128 91 85-54 99 66v64H0Z"/>
          <path d="M0 258 126 188l144 70 124-83 151 94 134-71 105 70 123-72 113 67v37H0Z"/>
        </svg>
        <div class="tree left"></div><div class="tree right"></div>
        <div class="ground"></div>
        <div class="pond"></div>
        <div class="book">
          <div class="page left"><div class="page-lines"><i></i><i></i><i></i><i></i><i></i></div></div>
          <div class="page right"><div class="page-lines"><i></i><i></i><i></i><i></i><i></i></div></div>
          <div class="book-wave" aria-hidden="true">
            <i style="--h:22%;--n:1"></i><i style="--h:58%;--n:2"></i><i style="--h:82%;--n:3"></i><i style="--h:43%;--n:4"></i><i style="--h:70%;--n:5"></i><i style="--h:31%;--n:6"></i><i style="--h:91%;--n:7"></i><i style="--h:49%;--n:8"></i><i style="--h:76%;--n:9"></i><i style="--h:38%;--n:10"></i><i style="--h:64%;--n:11"></i><i style="--h:27%;--n:12"></i><i style="--h:85%;--n:13"></i><i style="--h:52%;--n:14"></i><i style="--h:72%;--n:15"></i><i style="--h:34%;--n:16"></i><i style="--h:61%;--n:17"></i>
          </div>
          <button class="book-play" type="button" aria-label="Play story" data-play><svg class="play-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg><svg class="pause-icon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></svg></button>
        </div>
      </section>
    </main>

    <aside class="cast">
      <div class="cast-list">
        <button class="spirit" type="button" aria-label="Voice one"><span class="spirit-face"></span><span class="spirit-wave"><i style="--h:25%;--n:1"></i><i style="--h:68%;--n:2"></i><i style="--h:43%;--n:3"></i><i style="--h:88%;--n:4"></i><i style="--h:55%;--n:5"></i><i style="--h:73%;--n:6"></i><i style="--h:34%;--n:7"></i></span></button>
        <button class="spirit" type="button" aria-label="Voice two"><span class="spirit-face"></span><span class="spirit-wave"><i style="--h:62%"></i><i style="--h:31%"></i><i style="--h:79%"></i><i style="--h:47%"></i><i style="--h:91%"></i><i style="--h:38%"></i><i style="--h:66%"></i></span></button>
        <button class="spirit" type="button" aria-label="Voice three"><span class="spirit-face"></span><span class="spirit-wave"><i style="--h:39%"></i><i style="--h:74%"></i><i style="--h:52%"></i><i style="--h:84%"></i><i style="--h:30%"></i><i style="--h:67%"></i><i style="--h:48%"></i></span></button>
        <button class="spirit" type="button" aria-label="Voice four"><span class="spirit-face"></span><span class="spirit-wave"><i style="--h:76%"></i><i style="--h:42%"></i><i style="--h:63%"></i><i style="--h:28%"></i><i style="--h:86%"></i><i style="--h:51%"></i><i style="--h:70%"></i></span></button>
      </div>
    </aside>
  </div>

  <div class="player">
    <button class="round-button" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6Z"/></svg></button>
    <button class="round-button main-control" type="button" aria-label="Play story" data-play><svg class="play-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg><svg class="pause-icon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></svg></button>
    <button class="round-button" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6Z"/></svg></button>
    <div class="river" role="slider" tabindex="0" aria-label="Story progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45">
      <i style="--h:20%"></i><i style="--h:54%"></i><i style="--h:33%"></i><i style="--h:78%"></i><i style="--h:45%"></i><i style="--h:68%"></i><i style="--h:28%"></i><i style="--h:87%"></i><i style="--h:51%"></i><i style="--h:73%"></i><i style="--h:37%"></i><i style="--h:62%"></i><i style="--h:92%"></i><i style="--h:48%"></i><i style="--h:70%"></i><i style="--h:31%"></i><i style="--h:81%"></i><i style="--h:43%"></i><i style="--h:66%"></i><i style="--h:25%"></i><i style="--h:76%"></i><i style="--h:53%"></i><i style="--h:69%"></i><i style="--h:36%"></i><i style="--h:84%"></i>
    </div>
    <button class="sound-stone" type="button" aria-label="Volume"></button>
  </div>

  <script>
    const canopy = document.querySelector('#canopy');
    for (let index = 0; index < 14; index += 1) {
      const light = document.createElement('i');
      light.className = 'firefly';
      light.style.left = `${8 + (index * 29) % 86}%`;
      light.style.top = `${18 + (index * 43) % 68}%`;
      light.style.setProperty('--d', `${3.2 + (index % 5) * .8}s`);
      light.style.setProperty('--delay', `${index * -.37}s`);
      canopy.appendChild(light);
    }

    document.querySelectorAll('[data-play]').forEach((button) => button.addEventListener('click', () => {
      document.body.classList.toggle('playing');
    }));

    document.querySelector('#lightButton').addEventListener('click', () => {
      document.body.classList.toggle('dawn');
    });

    const seeds = document.querySelectorAll('.seed');
    seeds.forEach((seed) => seed.addEventListener('click', () => {
      seeds.forEach((item) => item.classList.remove('active'));
      seed.classList.add('active');
    }));
  </script>
</body>
</html>
